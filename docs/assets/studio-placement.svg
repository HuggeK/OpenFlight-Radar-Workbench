<text x="635.0" y="367.0" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal" >IWR launch, OPS</text>
<text x="635.0" y="383.0" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal" >2026-11-01: 0.90° MAE,</text>
