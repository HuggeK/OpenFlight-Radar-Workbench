<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="20" y="26" font-size="15" font-weight="600" fill="#1b2533">Side view: what to measure, from where (not to scale)</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b2533"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c46a12"/></marker>
  </defs>
  <!-- floor -->
  <line x1="20" y1="300" x2="880" y2="300" stroke="#5a6675" stroke-width="2"/>
  <text x="24" y="320" fill="#5a6675">floor (the surface the ball sits on)</text>
  <!-- unit -->
  <rect x="60" y="180" width="120" height="120" fill="#e9edf0" stroke="#1b2533" stroke-width="2"/>
  <text x="78" y="200" fill="#1b2533">OpenFlight</text>
  <line x1="166" y1="185" x2="166" y2="295" stroke="#1b2533" stroke-dasharray="4 3"/>
  <text x="96" y="290" font-size="11" fill="#5a6675">antenna face</text>
  <circle cx="166" cy="247" r="7" fill="#1f9d4c"/>
  <text x="58" y="172" font-size="12" fill="#1f9d4c">antenna centre</text>
  <!-- depth -->
  <line x1="166" y1="150" x2="180" y2="150" stroke="#1b2533" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="166" y1="155" x2="166" y2="180" stroke="#1b2533" stroke-width="0.8"/>
  <line x1="180" y1="155" x2="180" y2="180" stroke="#1b2533" stroke-width="0.8"/>
  <text x="186" y="146" fill="#1b2533">27 mm measured (software adds 30)</text>
  <!-- height -->
  <line x1="40" y1="300" x2="40" y2="247" stroke="#1b2533" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="36" y1="247" x2="160" y2="247" stroke="#1f9d4c" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="20" y="345" fill="#1b2533">radar-height-m: floor → antenna centre = 52.5 mm without feet (+ feet if fitted)</text>
  <!-- ball -->
  <rect x="520" y="292" width="90" height="8" fill="#9aa6b4"/>
  <text x="522" y="287" font-size="11" fill="#5a6675">mat</text>
  <circle cx="565" cy="281" r="10" fill="#ffffff" stroke="#1b2533" stroke-width="2"/>
  <line x1="630" y1="300" x2="630" y2="281" stroke="#1b2533" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="636" y="294" font-size="12" fill="#1b2533">ball-height-m = mat + 0.021</text>
  <!-- tee -->
  <line x1="180" y1="232" x2="555" y2="232" stroke="#c46a12" stroke-width="2" marker-start="url(#o)" marker-end="url(#o)"/>
  <text x="200" y="224" fill="#c46a12" font-weight="600">--iwr6843-tee-m: tape from the enclosure front, at antenna height → ball centre</text>
  <!-- net -->
  <line x1="850" y1="70" x2="850" y2="300" stroke="#1b2533" stroke-width="3"/>
  <text x="826" y="62" fill="#1b2533">net</text>
  <line x1="180" y1="110" x2="846" y2="110" stroke="#c46a12" stroke-width="2" marker-start="url(#o)" marker-end="url(#o)"/>
  <text x="200" y="102" fill="#c46a12" font-weight="600">--iwr6843-net-m: same start point → net (not ball → net)</text>
  <text x="200" y="264" font-size="12" fill="#5a6675">Enter both tape readings as they are. Don't add the 27 mm.</text>
</svg>
