<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="20" y="26" font-size="15" font-weight="600" fill="#1b2533">Top view: can marks on a straight line across boresight (L = 1.90 m)</text>
  <text x="20" y="46" font-size="12" fill="#5a6675">Seen from above, downrange to the right. Right of the target line (seen from behind the radar) is drawn downward.</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b2533"/></marker>
  </defs>
  <!-- unit -->
  <rect x="30" y="215" width="60" height="50" fill="#e9edf0" stroke="#1b2533" stroke-width="2"/>
  <text x="34" y="208" font-size="12" fill="#1b2533">OpenFlight</text>
  <circle cx="90" cy="240" r="4" fill="#c46a12"/>
  <text x="96" y="222" font-size="11" fill="#c46a12">0 point: front face, in front of the antenna centre</text>
  <!-- boresight -->
  <line x1="90" y1="240" x2="880" y2="240" stroke="#c46a12" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="752" y="232" font-size="12" fill="#c46a12">0° (boresight)</text>
  <!-- tape line -->
  <line x1="700" y1="62" x2="700" y2="418" stroke="#1b2533" stroke-width="2"/>
  <text x="708" y="76" font-size="12" fill="#1b2533">tape measure, square to boresight</text>
  <!-- right angle -->
  <path d="M700 252 L712 252 L712 240" fill="none" stroke="#1b2533"/>
  <!-- rays and marks -->
  <g stroke="#9aa6b4" stroke-width="0.8">
    <line x1="90" y1="240" x2="700" y2="74"/><line x1="90" y1="240" x2="700" y2="118"/>
    <line x1="90" y1="240" x2="700" y2="160"/><line x1="90" y1="240" x2="700" y2="200"/>
    <line x1="90" y1="240" x2="700" y2="280"/><line x1="90" y1="240" x2="700" y2="320"/>
    <line x1="90" y1="240" x2="700" y2="362"/><line x1="90" y1="240" x2="700" y2="406"/>
  </g>
  <g fill="#1d5be6">
    <circle cx="700" cy="74" r="6"/><circle cx="700" cy="118" r="6"/><circle cx="700" cy="160" r="6"/><circle cx="700" cy="200" r="6"/>
  </g>
  <g fill="#1f9d4c">
    <circle cx="700" cy="280" r="6"/><circle cx="700" cy="320" r="6"/><circle cx="700" cy="362" r="6"/><circle cx="700" cy="406" r="6"/>
  </g>
  <circle cx="700" cy="240" r="7" fill="#ffffff" stroke="#c46a12" stroke-width="3"/>
  <g font-size="12" fill="#1b2533">
    <text x="610" y="78">l692 · 20°</text><text x="610" y="122">l509 · 15°</text>
    <text x="610" y="164">l335 · 10°</text><text x="610" y="204">l166 · 5°</text>
    <text x="610" y="284">r166 · 5°</text><text x="610" y="324">r335 · 10°</text>
    <text x="610" y="366">r509 · 15°</text><text x="610" y="410">r692 · 20°</text>
    <text x="716" y="262">b1 / b2 / b3 (0 mm)</text>
  </g>
  <text x="716" y="132" font-size="11" fill="#5a6675">left marks</text>
  <text x="716" y="340" font-size="11" fill="#5a6675">right marks</text>
  <text x="716" y="384" font-size="11" fill="#5a6675">folder name = mm along the tape</text>
  <!-- distance -->
  <line x1="90" y1="440" x2="700" y2="440" stroke="#1b2533" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="300" y="460" fill="#1b2533">L = 1.90 m along boresight, from the enclosure front</text>
  <text x="96" y="384" font-size="11" fill="#5a6675">Square check at the line: 30 cm along boresight,</text>
  <text x="96" y="399" font-size="11" fill="#5a6675">40 cm along the tape, diagonal reads 50 cm.</text>
  <text x="96" y="418" font-size="11" fill="#5a6675">Keep every mark ≥ 35 cm from a wall.</text>
</svg>
